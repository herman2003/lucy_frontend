server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA routing: always fall back to index.html (Flutter web + GoRouter).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed build assets, but never for index.html.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|json|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
